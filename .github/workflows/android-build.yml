name: Build DeVi Browser APKs (Debug & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set executable permissions for gradlew
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x ./android/gradlew 2>/dev/null || true

      - name: Verify Gradle Wrapper Version
        run: |
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            echo "Using android/ directory as project root"
            cd android
          fi
          ./gradlew --version

      - name: Build Debug APK
        run: |
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            cd android
          fi
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            cd android
          fi
          ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeViBrowser-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeViBrowser-Release-APK
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: warn
