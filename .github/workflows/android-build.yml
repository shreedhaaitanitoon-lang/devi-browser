name: Build DeVi Browser APKs (Debug & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Ultimate Self-Heal and Organize Android Project Structure
        run: |
          echo "Organizing and self-healing Android project layout..."
          
          if [ -d "android/app" ]; then
            mkdir -p app
            cp -r android/app/* app/
          elif [ -d "android" ]; then
            cp -r android/* .
          fi

          # Ensure resource folders and essential files exist
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. Ensure themes.xml exists
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.DeViBrowser" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/orange_500</item>
              </style>
          </resources>
          EOF
          fi

          # 2. Ensure colors.xml exists
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="orange_500">#FF6B00</color>
              <color name="amber_500">#F59E0B</color>
              <color name="indigo_600">#4F46E5</color>
          </resources>
          EOF
          fi

          # 3. Ensure activity_main.xml layout exists with valid drawable reference
          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F172A">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="12dp"
                  android:background="#1E293B">
                  <ImageView
                      android:id="@+id/ivLock"
                      android:layout_width="20dp"
                      android:layout_height="20dp"
                      android:src="@android:drawable/ic_lock_lock"
                      android:contentDescription="Security Lock" />
                  <EditText
                      android:id="@+id/etUrlBar"
                      android:layout_width="0dp"
                      android:layout_height="40dp"
                      android:layout_weight="1"
                      android:layout_marginStart="8dp"
                      android:layout_marginEnd="8dp"
                      android:background="#0F172A"
                      android:paddingHorizontal="12dp"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:singleLine="true"
                      android:hint="Search or enter URL"
                      android:textColorHint="#64748B" />
                  <Button
                      android:id="@+id/btnSearch"
                      android:layout_width="64dp"
                      android:layout_height="36dp"
                      android:text="Go"
                      android:textSize="12sp"
                      android:textColor="#FFFFFF"
                      android:backgroundTint="#FF6B00" />
              </LinearLayout>
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </LinearLayout>
          EOF
          fi

          # 4. Ensure launcher icons exist
          if [ ! -f "app/src/main/res/drawable/ic_launcher_foreground.xml" ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path android:fillColor="#FF6B00" android:pathData="M24,24h60v60h-60z"/>
          </vector>
          EOF
          fi

          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#FFFFFF"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          fi

          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" ]; then
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 5. Ensure root build.gradle.kts and settings.gradle.kts exist
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DeViBrowser"
          include(":app")
          EOF

          # Bootstrap Gradle Wrapper if missing
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Bootstrapping Gradle Wrapper JAR..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeViBrowser-Debug-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeViBrowser-Release-APK
          path: '**/build/outputs/apk/release/app-release.apk'
