name: Build DeVi Browser APKs (Debug & Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Prepare Android Project & Gradle Wrapper
        run: |
          echo "Checking repository structure..."
          ls -la
          
          # If build.gradle.kts or settings.gradle.kts are missing in root, check if they are inside android/
          if [ ! -f "build.gradle.kts" ] && [ -f "android/build.gradle.kts" ]; then
            echo "Moving files from android/ to root..."
            cp -r android/* .
          fi
          
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Bootstrapping Gradle Wrapper JAR..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Verify Gradle Version
        run: ./gradlew --version

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeViBrowser-Debug-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeViBrowser-Release-APK
          path: '**/build/outputs/apk/release/app-release.apk'
